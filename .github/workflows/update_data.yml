name: Update US Macro & HS3924 Data

on:
  schedule:
    # 每月 15 日（CPI 後）與 28 日（PCE 後）UTC 14:00 (台北時間 22:00) 自動執行
    - cron: '0 14 15,28 * *'
  workflow_dispatch:
    inputs:
      force_analyze:
        description: '強制重新呼叫 Gemini 產出綜合判讀（即使無新月份數據）'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch FRED & US Census data and run Gemini analysis
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          GEMINI_MODEL: 'gemini-2.5-flash'
        run: |
          if [ "${{ github.event.inputs.force_analyze }}" = "true" ]; then
            python scripts/fetch_and_analyze.py --force-analyze
          else
            python scripts/fetch_and_analyze.py
          fi

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/data.json data/analysis.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): auto-update FRED, Census & AI analysis [$(date -u +'%Y-%m-%d')]"
            git push
          fi
